name: mbolo-production

# Politique commune de rotation des journaux Docker.
# Elle limite l'espace disque consommé sans service externe payant.
x-logging: &mbolo-logging
  driver: json-file
  options:
    max-size: "${MBOLO_LOG_MAX_SIZE:-10m}"
    max-file: "${MBOLO_LOG_MAX_FILES:-5}"

services:
  postgres:
    logging: *mbolo-logging
    image: postgres:18.4-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backups:/backups
    networks:
      - data_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  redis:
    logging: *mbolo-logging
    image: redis:8.8-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --protected-mode
      - "yes"
    volumes:
      - redis_data:/data
    networks:
      - data_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    security_opt:
      - no-new-privileges:true

  backend:
    logging: *mbolo-logging
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 256
    stop_grace_period: 30s
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVE_MEDIA_LOCALLY: "false"
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - static_data:/app/backend/staticfiles
      - media_data:/app/backend/media
      - private_media_data:/app/backend/private_media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
      - data_network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=5);
          assert response.status == 200;
          assert json.load(response).get('status') == 'ok'
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  frontend:
    logging: *mbolo-logging
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 128
    stop_grace_period: 10s
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:${MBOLO_HTTP_PORT:-8080}:8080"
    volumes:
      - static_data:/srv/mbolo/static:ro
      - media_data:/srv/mbolo/media:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  private_media_data:

networks:
  app_network:
    driver: bridge
  data_network:
    driver: bridge
    internal: true

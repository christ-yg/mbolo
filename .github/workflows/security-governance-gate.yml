name: Mbolo Security Governance Gate 30-49

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mbolo-security-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: Gouvernance sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Vérifier les contrôles 30-49
        run: bash scripts/security-governance-gate-check.sh

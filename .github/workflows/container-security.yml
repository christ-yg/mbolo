name: Mbolo Container Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Une image peut devenir vulnérable sans changement du code lorsqu'une
  # nouvelle CVE est publiée. Ce contrôle hebdomadaire reconstruit donc les
  # images depuis main et les analyse avec une base Trivy récente.
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

concurrency:
  group: mbolo-container-security-${{ github.ref }}
  cancel-in-progress: true

# Le workflow construit et analyse les images sans les publier. Les SBOM sont
# de simples artefacts temporaires du workflow : aucun registre ni secret de
# production n'est nécessaire.
permissions:
  contents: read

jobs:
  scan-production-images:
    name: Vulnérabilités et SBOM des images Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Les images sont construites exactement depuis les Dockerfiles utilisés
      # par compose.production.yaml. Aucun secret de production n'est requis.
      - name: Construire l'image backend
        run: >-
          docker build
          --file backend/Dockerfile.production
          --tag mbolo-backend-security:${{ github.sha }}
          .

      - name: Construire l'image frontend
        run: >-
          docker build
          --file frontend/Dockerfile.production
          --tag mbolo-frontend-security:${{ github.sha }}
          .

      # Les runners GitHub sont éphémères : le dossier de destination doit être
      # créé explicitement avant que Syft puisse y écrire les deux inventaires.
      - name: Préparer le dossier des SBOM
        run: mkdir -p sbom

      # Chaque nomenclature CycloneDX inventorie les paquets du système et les
      # bibliothèques applicatives réellement présentes dans l'image finale.
      - name: Générer le SBOM CycloneDX du backend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: mbolo-backend-security:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom/mbolo-backend.cdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.44.0

      - name: Générer le SBOM CycloneDX du frontend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: mbolo-frontend-security:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom/mbolo-frontend.cdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.44.0

      # Un seul artefact facilite le téléchargement et réduit le stockage. La
      # conservation courte suffit pour les audits ponctuels et reste gratuite.
      - name: Publier les SBOM du contrôle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mbolo-production-sbom-${{ github.sha }}
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      # Le contrôle bloque uniquement une vulnérabilité critique disposant
      # déjà d'un correctif. Cela évite les échecs impossibles à résoudre tout
      # en empêchant la fusion d'une image dangereuse et corrigeable.
      - name: Scanner l'image backend avec Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: mbolo-backend-security:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          scanners: vuln
          timeout: 10m0s
      - name: Scanner l'image frontend avec Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: mbolo-frontend-security:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          scanners: vuln
          timeout: 10m0s

name: Mbolo Security Evidence Gate 50-69

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mbolo-security-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    name: Preuves opérationnelles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Vérifier les registres 50-69
        run: bash scripts/security-evidence-gate-check.sh

# Une requête locale arrive directement en HTTP : on conserve $scheme.
# Une requête passée par le proxy TLS Caddy contient X-Forwarded-Proto=https :
# on conserve alors le protocole HTTPS original jusqu'à Django.
#
# Cette confiance reste limitée par l'architecture Docker : le frontend est
# publié uniquement sur 127.0.0.1 en local et Caddy communique avec lui sur le
# réseau Docker privé app_network.
map $http_x_forwarded_proto $mbolo_forwarded_proto {
    default $scheme;
    https   https;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /srv/mbolo/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Photos publiques de profil uniquement. Les justificatifs privés de
    # vérification restent hors de ce volume et ne sont jamais servis ici.
    location /media/ {
        alias /srv/mbolo/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mbolo_forwarded_proto;
        proxy_set_header X-Mbolo-Client-IP $http_x_mbolo_client_ip;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mbolo_forwarded_proto;
        proxy_set_header X-Mbolo-Client-IP $http_x_mbolo_client_ip;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mbolo_forwarded_proto;
        proxy_set_header X-Mbolo-Client-IP $http_x_mbolo_client_ip;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
